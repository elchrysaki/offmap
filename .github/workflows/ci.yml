name: OffMap CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: offmap-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: offmap
          POSTGRES_USER: offmap
          POSTGRES_PASSWORD: offmap
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U offmap -d offmap"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: true
      DATABASE_URL: postgres://offmap:offmap@127.0.0.1:5432/offmap
      PAYLOAD_SECRET: ci-only-payload-secret-at-least-32-characters
      PAYLOAD_PUBLIC_SERVER_URL: http://localhost:3001
      SUBMISSION_HASH_SECRET: ci-only-submission-hash-secret-32-characters
      EXPO_PUBLIC_API_URL: http://127.0.0.1:3001
      EXPO_PUBLIC_SITE_URL: http://127.0.0.1:8081
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @offmap/cms generate:types
      - run: pnpm --filter @offmap/cms migration:import
      - run: pnpm verify
      - run: pnpm --filter @offmap/app doctor
      - run: pnpm build
      - run: pnpm --filter @offmap/app exec playwright install --with-deps chromium
      - run: pnpm test:e2e
